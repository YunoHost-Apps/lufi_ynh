#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "lufi"
name = "Lufi"
description.en = "Files and sharing anonymous application"
description.fr = "Application de partage de fichiers anonyme"

version = "0.07.3~ynh1"

maintainers = [ "frju365", "cyp" ]

[upstream]
license = "AGPL-3.0-or-later"
demo = "https://demo.lufi.io/"
admindoc = "https://framagit.org/luc/lufi/wikis/home"
code = "https://framagit.org/fiat-tux/hat-softwares/lufi"
website = "https://git.framasoft.org/luc/lufi"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = true
sso = false

disk = "50M"
ram.build = "550M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/lufi"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

    [install.use_ldap]
    ask.en = "Install Lufi with LDAP configuration?"
    ask.fr = "Installer Lufi avec la configuration LDAP ?"
    help.en = "Lufi with LDAP enabled will allow only YunoHost users to upload."
    help.fr = "Lufi avec LDAP activé autorisera seulement les utilisateurs YunoHost à téléverser."
    type = "boolean"
    default = false

[resources]
    [resources.sources.main]
    url = "https://framagit.org/fiat-tux/hat-softwares/lufi/-/archive/0.07.3/lufi-0.07.3.tar.bz2"
    sha256 = "10bef5d2004550305f8e38352d1517aa7efbd37e197c6bb2967f2745802be6cc"
    autoupdate.strategy = "latest_gitlab_release"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]
    subdirs = [ "upload" ]

    [resources.permissions]
    main.url = "/"

    [resources.ports]

    [resources.apt]
    packages = [
        "build-essential",
        "libssl-dev",
        "zlib1g-dev",
        "libpq-dev",
        "libio-socket-ssl-perl",
        "liblwp-protocol-https-perl",
        "carton",
        "postgresql",
    ]

    [resources.database]
    type = "postgresql"
